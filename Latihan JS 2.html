<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }
        
        h2 {
            font-family: 'Times New Roman', serif;
            font-size: 2.5em;
        }
        
        #input-container {
            display: flex;
            margin-bottom: 20px;
        }
        
        #task-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #add-button {
            padding: 8px 15px;
            margin-left: 10px;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
        }
        
        #add-button:hover {
            background-color: #e0e0e0;
        }

        #task-list {
            list-style: disc;
            padding-left: 20px;
        }

        #task-list li {
            font-size: 1.1em;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>To-Do List</h2>
        
        <div id="input-container">
            <input type="text" id="task-input" placeholder="Tulis tugas...">
            <button id="add-button">Tambah</button>
        </div>
        
        <ul id="task-list">
        </ul>
    </div>

    <script>
        const taskInput = document.getElementById('task-input');
        const addButton = document.getElementById('add-button');
        const taskList = document.getElementById('task-list');

        addButton.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function(event) {
            // Cek jika tombol yang ditekan adalah "Enter" (kode 13)
            if (event.key === 'Enter') {
                addTask();
            }
        });

        function addTask() {
            const taskText = taskInput.value.trim();

            if (taskText !== "") {
                const listItem = document.createElement('li');
                listItem.textContent = taskText;
                taskList.appendChild(listItem);
                taskInput.value = ""; // Mengosongkan input setelah menambahkan
            }
        }
    </script>

</body>
</html>
